name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22's bundled npm
      # predates that, so pin explicitly rather than trust whatever setup-node ships.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm publish
