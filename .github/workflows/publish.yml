name: Publish to npm

# Publish on an explicit version tag or manual dispatch.
# Default-branch updates arrive through reviewed pull requests.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}
  # After the reviewed version update is merged, a maintainer may run:
  #   gh workflow run publish.yml --repo entire-vc/evc-spark-mcp --ref main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22's bundled npm
      # predates that, so pin explicitly rather than trust whatever setup-node ships.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm publish
