name: Publish to npm

# ⚠️ `push: tags` alone is a dead trigger on this repo. Per Pavel's 22.08
# mirror-policy decision (variant B), GitLab→GitHub mirroring deliberately
# HOLDS tags for any repo whose tag carries a publisher (npm/PyPI/Docker
# Hub/GitHub Release) — double-publishing the same tag fails hard downstream.
# evc-spark-mcp is exactly that case: a tag pushed to GitLab canon (origin)
# will never reach this GitHub mirror on its own. v1.1.0 sat unpublished for
# ~1.5 months this way, unnoticed. workflow_dispatch is the real trigger now;
# the tag-push trigger stays only for the (currently theoretical) case of a
# tag pushed directly to GitHub.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}
  # Trigger this from GitLab canon after bumping package.json's version and
  # merging to main (which DOES mirror to GitHub automatically):
  #   gh workflow run publish.yml --repo entire-vc/evc-spark-mcp --ref main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22's bundled npm
      # predates that, so pin explicitly rather than trust whatever setup-node ships.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm publish
